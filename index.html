<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. Instantly tells the browser to go to the woodyclippy URL -->
    <meta http-equiv="refresh" content="0; url=https://github.io">
    <link rel="canonical" href="https://github.io">
</head>
<body>
    <!-- 2. Text fallback link just in case -->
    <p>Redirecting you to <a href="https://github.io">DedalordCentral.github.io</a>.</p>
    <script>
        // 3. Smart JavaScript fallback to preserve extra links (e.g. /about or /contact)
        var targetSite = "https://github.io";
        window.location.replace(targetSite + window.location.pathname);
    </script>
</body>
</html>
